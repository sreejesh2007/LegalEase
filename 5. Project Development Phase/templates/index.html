<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        LegalEase - AI Legal Document Generator
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>

<body>

<div class="container">

    <header class="header">

        <h1>LegalEase</h1>

        <p>
            AI-Powered Legal Document Generator
        </p>

    </header>


    <div class="notice">

        <strong>Important:</strong>

        LegalEase generates AI-assisted legal
        document drafts. The generated content
        should be reviewed by a qualified legal
        professional before actual use.

    </div>


    <form
        action="/generate"
        method="post"
        class="form-card"
    >

        <h2>
            Document Information
        </h2>


        <label for="document_type">
            Document Type
        </label>

        <select
            id="document_type"
            name="document_type"
            required
        >

            <option value="">
                Select document type
            </option>

            <option value="Non-Disclosure Agreement (NDA)">
                Non-Disclosure Agreement (NDA)
            </option>

            <option value="Employment Agreement">
                Employment Agreement
            </option>

            <option value="Lease Agreement">
                Lease Agreement
            </option>

            <option value="Service Agreement">
                Service Agreement
            </option>

        </select>


        <label for="party_a">
            Party A
        </label>

        <input
            type="text"
            id="party_a"
            name="party_a"
            placeholder="Enter first party name"
            required
        >


        <label for="party_b">
            Party B
        </label>

        <input
            type="text"
            id="party_b"
            name="party_b"
            placeholder="Enter second party name"
            required
        >


        <label for="effective_date">
            Effective Date
        </label>

        <input
            type="date"
            id="effective_date"
            name="effective_date"
            required
        >


        <label for="term">
            Term
        </label>

        <input
            type="text"
            id="term"
            name="term"
            placeholder="Example: 2 years"
            required
        >


        <label for="jurisdiction">
            Jurisdiction
        </label>

        <input
            type="text"
            id="jurisdiction"
            name="jurisdiction"
            placeholder="Example: Tamil Nadu, India"
            required
        >


        <label for="purpose">
            Purpose / Role / Property Description
        </label>

        <textarea
            id="purpose"
            name="purpose"
            rows="4"
            placeholder="Describe the purpose, role or property"
            required
        ></textarea>


        <label for="consideration">
            Payment / Consideration
        </label>

        <textarea
            id="consideration"
            name="consideration"
            rows="3"
            placeholder="Enter payment or consideration details"
            required
        ></textarea>


        <label for="special_terms">
            Special Terms
        </label>

        <textarea
            id="special_terms"
            name="special_terms"
            rows="4"
            placeholder="Enter any additional terms"
        ></textarea>


        <h2>
            Branding
        </h2>


        <label for="logo_text">
            Logo / Brand Text
        </label>

        <input
            type="text"
            id="logo_text"
            name="logo_text"
            value="LegalEase"
        >


        <label for="font">
            Font
        </label>

        <select
            id="font"
            name="font"
        >

            <option value="Arial">
                Arial
            </option>

            <option value="Georgia">
                Georgia
            </option>

            <option value="Times New Roman">
                Times New Roman
            </option>

            <option value="Courier New">
                Courier New
            </option>

        </select>


        <button
            type="submit"
            class="primary-button"
        >
            Generate Legal Document
        </button>

    </form>

</div>

</body>

</html>
